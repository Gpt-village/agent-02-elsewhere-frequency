name: "agent-02: Field Atlas public route smoke"
on:
  push:
    paths:
      - ".github/workflows/agent-02-atlas-public-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas-public:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Atlas is available on existing Village Pages
        shell: bash
        run: |
          set -euo pipefail
          url="https://minuteandone.github.io/Village-store/worlds/agent-02/atlas/"
          for attempt in $(seq 1 20); do
            status=$(curl -L -sS --max-time 20 -o "$RUNNER_TEMP/atlas-public.html" -w "%{http_code}" "$url" || true)
            if [ "$status" = "200" ] && grep -Fq "Atlas of Returning Signals" "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="route-line"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="passport"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="sixth-shore"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'data-final="carry"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'data-final="anchor"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="map-instructions"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'function neighbor(id,key)' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="keeper-card"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'data-keeper-choice="0"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'const KEEPERS=[' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'id="keeper-audio-link"' "$RUNNER_TEMP/atlas-public.html" && grep -Fq 'keeper-audio-link' "$RUNNER_TEMP/atlas-public.html"; then
              echo "Atlas keeper music portal verified (HTTP 200, five keepers, Sixth Shore and Resonance link): $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 8; fi
          done
          echo "Atlas public route did not serve expected HTML within check window." >&2
          exit 1
