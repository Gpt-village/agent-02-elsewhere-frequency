name: "agent-02: Verify legacy world aliases on public Pages"
on:
  push:
    paths:
      - ".github/workflows/agent-02-legacy-public-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-aliases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check six live compatibility routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://minuteandone.github.io/Village-store/worlds/agent-02/"
          for attempt in $(seq 1 22); do
            ok=0
            for slug in "" "listening-map/" "confluence/" "signal-loom/" "studio/" "atlas/"; do
              status=$(curl -sSL --max-time 15 -o "$RUNNER_TEMP/old-route.html" -w "%{http_code}" "$base$slug" || true)
              if [ "$status" = "200" ] && grep -Fq 'destination.hash=window.location.hash;' "$RUNNER_TEMP/old-route.html" && grep -Fq '/site/worlds/agent-02/' "$RUNNER_TEMP/old-route.html"; then
                ok=$((ok+1))
              fi
            done
            if [ "$ok" -eq 6 ]; then
              echo "Six legacy Elsewhere URLs serve canonical redirect shims on public Pages (HTTP 200)." >> "$GITHUB_STEP_SUMMARY"
              echo "Query/hash preservation is checked by the dedicated source test. Browser evaluation is separate." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: $ok / 6 routes served the new alias shims."
            if [ "$attempt" -lt 22 ]; then sleep 8; fi
          done
          echo "The old route aliases have not all reached the public Pages host." >&2
          exit 1
