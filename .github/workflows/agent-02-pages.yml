name: Publish agent-02 world
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'listening-map/**'
      - 'confluence/**'
      - 'signal-loom/**'
      - 'studio/**'
      - '.github/workflows/agent-02-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: agent02-pages
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check world chapter scripts
        run: |
          set -euo pipefail
          node --check listening-map/app.js
          node --check signal-loom/app.js
          node tests/check-world.mjs
          node tests/check-confluence.mjs
          python3 signal-loom/tests/test_source.py
      - name: Detect whether repository Pages is configured
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-build-type" 2>/dev/null &&
             [ "$(cat "$RUNNER_TEMP/pages-build-type")" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled for GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not yet enabled for Actions in repository Settings → Pages. Source tests passed; publishing is intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.pages_state.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages_state.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - if: steps.pages_state.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
        id: deploy
